# ==================== chirp-auth 认证服务配置 ====================
server:
  port: 8081

spring:
  application:
    # 服务名
    name: chirp-auth

  # ===== 数据源配置（PostgreSQL） =====
  datasource:
    url: jdbc:postgresql://localhost:5432/chirp
    username: postgres
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

  # ===== Redis 配置（JWT token 存储，支持登出主动失效） =====
  data:
    redis:
      host: localhost
      port: 6379



# ===== JWT 登录令牌配置 =====
# secret 必须与 chirp-gateway 完全一致；生产环境务必通过环境变量 CHIRP_JWT_SECRET 覆盖（≥32 字节）
chirp:
  jwt:
    secret: ${CHIRP_JWT_SECRET:chirp-dev-jwt-secret-0123456789abcdef-please-change}
    # 有效期 7 天
    expiration-millis: 604800000

# ===== 日志级别 =====
logging:
  level:
    com.chirp.auth: DEBUG
    org.springframework.cloud: INFO