# ==================== chirp-gateway 配置 ====================
server:
  port: 8080

spring:
  application:
    name: chirp-gateway

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      routes:
        - id: chirp-auth-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: chirp-posts-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/posts/**

        - id: chirp-users-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/users/**

        - id: chirp-comments-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/comments/**

        - id: chirp-notifications-route
          uri: http://localhost:8084
          predicates:
            - Path=/api/notifications/**

        - id: chirp-search-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/search/**

        - id: chirp-hashtags-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/hashtags/**

        - id: chirp-messages-route
          uri: http://localhost:8084
          predicates:
            - Path=/api/messages/**

        - id: chirp-bookmarks-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/bookmarks/**

app:
  cors-origin: http://localhost:4173

chirp:
  jwt:
    secret: ${CHIRP_JWT_SECRET:chirp-dev-jwt-secret-0123456789abcdef-please-change}
    expiration-millis: 604800000

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.loadbalancer: INFO