# ==================== chirp-social 社交服务配置 ====================
server:
  port: 8084

spring:
  application:
    name: chirp-social

  datasource:
    url: jdbc:postgresql://localhost:5432/chirp
    username: postgres
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

  data:
    redis:
      host: localhost
      port: 6379

chirp:
  jwt:
    secret: ${CHIRP_JWT_SECRET:chirp-dev-jwt-secret-0123456789abcdef-please-change}
    expiration-millis: 604800000

logging:
  level:
    com.chirp.social: DEBUG